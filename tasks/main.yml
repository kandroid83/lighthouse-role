---
- name: Install git and nginx
  ansible.builtin.apt:
    name:
      - git
      - nginx
    state: present
    update_cache: true

- name: Clone Lighthouse repository
  ansible.builtin.git:
    repo: "https://github.com/VKCOM/lighthouse.git"
    dest: "{{ lighthouse_dest }}"
    version: master

- name: Deploy Lighthouse nginx site config
  ansible.builtin.template:
    src: "lighthouse.conf.j2"
    dest: "/etc/nginx/sites-available/lighthouse.conf"
    mode: '0644'
  notify: Reload nginx

- name: Enable Lighthouse site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/lighthouse.conf"
    dest: "/etc/nginx/sites-enabled/lighthouse.conf"
    state: link
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/default"
    state: absent
  notify: Reload nginx
